<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AR Monkey Hiro</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial}
#ui{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999}
button{padding:10px 16px;margin:4px;font-size:16px}
</style>
</head>
<body>
<div id="ui">
<button onclick="setAction('walk')">เดิน</button>
<button onclick="setAction('run')">วิ่ง</button>
<button onclick="setAction('sleep')">นอน</button>
</div>
<a-scene embedded arjs='sourceType: webcam;'>
<a-marker preset="hiro">
<a-entity id="monkey"
position="0 0 0"
scale="0.8 0.8 0.8"
gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Suzanne/glTF-Binary/Suzanne.glb"
rotation="0 0 0">
</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
const monkey=()=>document.querySelector('#monkey');
function setAction(action){
 const m=monkey();
 if(!m) return;
 if(action==='walk'){
   m.setAttribute('animation','property: rotation; to: 0 360 0; loop:true; dur:3000');
   m.setAttribute('scale','0.8 0.8 0.8');
 }
 if(action==='run'){
   m.setAttribute('animation','property: rotation; to: 0 360 0; loop:true; dur:1000');
   m.setAttribute('scale','1 1 1');
 }
 if(action==='sleep'){
   m.removeAttribute('animation');
   m.setAttribute('rotation','90 0 0');
 }
}
</script>
</body>
</html>
